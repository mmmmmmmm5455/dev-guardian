name: CI — code-audit-suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate skill files
        shell: bash
        run: |
          echo "Checking skill structure..."
          for d in code-audit skill-tester; do
            if [[ -f "$d/SKILL.md" ]]; then
              echo "  $d/SKILL.md exists"
            else
              echo "  FAIL: $d/SKILL.md missing"
              exit 1
            fi
          done
          echo "All skill files present"
      - name: Validate LICENSE
        shell: bash
        run: |
          if grep -q "MIT" LICENSE; then
            echo "LICENSE: MIT confirmed"
          else
            echo "FAIL: LICENSE not MIT"
            exit 1
          fi

  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile orchestrator
        run: python -m py_compile skill-tester/orchestrator.py
      - name: Run unittest contracts
        run: python -m unittest discover -s skill-tester -p "test_*.py" -v
